[profile.default]
src = "."
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=../frontend/node_modules/@openzeppelin/",
    "@layerzerolabs/=../frontend/node_modules/@layerzerolabs/",
    "forge-std/=lib/forge-std/src/",
]

allow_paths = ["../frontend/node_modules"]

